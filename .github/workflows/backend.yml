name: Backend CI

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'

jobs:
  test:
    name: Pytest
    runs-on: ubuntu-latest
    # PostgreSQL dla testów bazy (test_db.py, test_migrations.py); bez niego te testy są pomijane.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: worldsmith
          POSTGRES_PASSWORD: worldsmith
          POSTGRES_DB: worldsmith
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U worldsmith"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://worldsmith:worldsmith@localhost:5432/worldsmith

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Migracje zgodne z modelami
        run: alembic upgrade head && alembic check

      - name: Test
        run: pytest
